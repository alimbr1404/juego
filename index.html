<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 Cleo vidente ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a0b1f 0%, #0d0510 100%);
            font-family: 'Segoe UI', 'Georgia', serif;
            padding: 1.5rem;
        }

        .tarot-card {
            max-width: 700px;
            width: 100%;
            background: linear-gradient(145deg, #3b1f4a, #241530);
            padding: 2.5rem 1.8rem;
            border-radius: 3rem 1.5rem 3rem 1.5rem;
            box-shadow: 
                0 20px 60px rgba(106, 13, 173, 0.7),
                inset 0 0 40px rgba(180, 90, 220, 0.3),
                0 0 30px #9b4dca88;
            border: 1px solid #b380d0;
            backdrop-filter: blur(2px);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .tarot-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(200, 120, 255, 0.08), transparent 60%),
                        radial-gradient(circle at 70% 80%, rgba(160, 70, 220, 0.08), transparent 50%);
            pointer-events: none;
            animation: girarBrillo 30s linear infinite;
            z-index: 0;
        }

        @keyframes girarBrillo {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tarot-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, #d9b0ff, transparent),
                radial-gradient(2px 2px at 40% 70%, #c58af0, transparent),
                radial-gradient(2px 2px at 60% 20%, #e5c3ff, transparent),
                radial-gradient(3px 3px at 80% 80%, #b77bdb, transparent),
                radial-gradient(2px 2px at 10% 90%, #d4a0f5, transparent),
                radial-gradient(3px 3px at 90% 10%, #ca8bf0, transparent);
            background-size: 200% 200%;
            background-repeat: no-repeat;
            opacity: 0.5;
            pointer-events: none;
            animation: centelleo 8s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes centelleo {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 0.8; transform: scale(1.05); }
        }

        .tarot-content {
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 3rem;
            letter-spacing: 4px;
            color: #f0d6ff;
            text-shadow: 0 0 15px #b77bdb, 0 0 30px #8a4ab0, 0 0 60px #4f1f66;
            margin-bottom: 0.3rem;
            font-weight: 300;
        }

        .subtitulo {
            color: #c9a3dc;
            font-size: 0.9rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            border-top: 1px solid #7d4b9e;
            border-bottom: 1px solid #7d4b9e;
            display: inline-block;
            padding: 0.4rem 1.8rem;
            backdrop-filter: blur(4px);
            background: rgba(70, 30, 90, 0.3);
            border-radius: 40px;
            margin-bottom: 2rem;
            box-shadow: 0 0 20px #7d4b9e55;
        }

        .carta-tarot {
            background: linear-gradient(145deg, #f5efe8, #e8ddd0);
            border-radius: 18px 8px 18px 8px;
            padding: 1.8rem 1.2rem 1.5rem;
            margin: 1.5rem auto;
            max-width: 340px;
            width: 100%;
            border: 3px solid #b380d0;
            box-shadow: 0 0 20px rgba(130, 50, 180, 0.3), inset 0 0 20px rgba(200, 160, 220, 0.2);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            min-height: 380px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .carta-tarot.brillando {
            animation: brilloMagico 0.8s ease 3;
            box-shadow: 0 0 60px #b77bdb, 0 0 120px #9b4dca, 0 0 200px #7b3b9e88;
        }

        @keyframes brilloMagico {
            0% { box-shadow: 0 0 20px rgba(130, 50, 180, 0.3); }
            25% { box-shadow: 0 0 80px #b77bdb, 0 0 150px #9b4dca; transform: scale(1.02); }
            50% { box-shadow: 0 0 40px #b77bdb, 0 0 80px #9b4dca; transform: scale(0.98); }
            75% { box-shadow: 0 0 80px #b77bdb, 0 0 150px #9b4dca; transform: scale(1.02); }
            100% { box-shadow: 0 0 20px rgba(130, 50, 180, 0.3); transform: scale(1); }
        }

        .carta-tarot::before {
            content: '✦';
            position: absolute;
            top: 10px;
            left: 15px;
            color: #6f3790;
            font-size: 1.2rem;
            opacity: 0.4;
        }

        .carta-tarot::after {
            content: '✦';
            position: absolute;
            bottom: 10px;
            right: 15px;
            color: #6f3790;
            font-size: 1.2rem;
            opacity: 0.4;
        }

        .gato-svg {
            width: 100%;
            max-width: 220px;
            height: auto;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
        }

        .nombre-carta {
            font-size: 1.6rem;
            font-weight: 600;
            color: #2d1638;
            text-shadow: 0 0 10px rgba(130, 50, 180, 0.2);
            margin: 0.8rem 0 0.2rem;
            letter-spacing: 1px;
            font-family: 'Georgia', serif;
        }

        .significado-carta {
            font-size: 0.95rem;
            color: #3d2a4a;
            max-width: 400px;
            margin: 0.2rem auto 0;
            padding: 0 0.5rem;
            line-height: 1.5;
            font-style: italic;
        }

        .btn-tarot {
            background: linear-gradient(135deg, #6f3790, #451e5a);
            border: 1px solid #ac7ac9;
            color: #f3e6ff;
            font-size: 1.5rem;
            padding: 1rem 2rem;
            border-radius: 50px 15px 50px 15px;
            cursor: pointer;
            font-weight: 400;
            letter-spacing: 3px;
            box-shadow: 0 0 30px #8a4ab088, 0 6px 0 #2a1233;
            transition: all 0.15s ease;
            backdrop-filter: blur(4px);
            background: rgba(90, 40, 120, 0.85);
            margin-top: 0.5rem;
            width: 100%;
            max-width: 300px;
            text-transform: uppercase;
            font-family: 'Georgia', serif;
            border-bottom: 3px solid #c795e0;
        }

        .btn-tarot:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 50px #b77bdb, 0 8px 0 #2a1233;
            background: rgba(120, 60, 160, 0.9);
        }

        .btn-tarot:active {
            transform: translateY(4px);
            box-shadow: 0 0 30px #9b4dca, 0 2px 0 #2a1233;
        }

        .pie {
            margin-top: 1.8rem;
            color: #785a8a;
            font-size: 0.8rem;
            letter-spacing: 2px;
            border-top: 1px solid #4f2b62;
            padding-top: 1.2rem;
            opacity: 0.8;
            text-shadow: 0 0 6px #3d1d4b;
        }

        .pie span {
            display: inline-block;
            animation: parpadeo 3s infinite alternate;
        }

        @keyframes parpadeo {
            0% { opacity: 0.4; text-shadow: 0 0 2px #a06bbd; }
            100% { opacity: 1; text-shadow: 0 0 20px #c38ce0; }
        }

        @media (max-width: 500px) {
            .tarot-card {
                padding: 1.5rem 1rem;
                border-radius: 2.5rem 1.2rem 2.5rem 1.2rem;
            }
            h1 {
                font-size: 2.2rem;
            }
            .nombre-carta {
                font-size: 1.3rem;
            }
            .significado-carta {
                font-size: 0.85rem;
            }
            .btn-tarot {
                font-size: 1.1rem;
                padding: 0.8rem 1.2rem;
                max-width: 100%;
            }
            .carta-tarot {
                padding: 1.2rem 0.8rem 1rem;
                max-width: 280px;
                min-height: 320px;
            }
            .gato-svg {
                max-width: 170px;
            }
            .subtitulo {
                font-size: 0.65rem;
                padding: 0.3rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="tarot-card">
        <div class="tarot-content">
            <h1>🐱 Cleo vidente</h1>
            <div class="subtitulo">✦ tarot gatuno ✦</div>

            <div class="carta-tarot" id="cartaTarot">
                <svg class="gato-svg" id="gatoSVG" viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg"></svg>
                <div class="nombre-carta" id="cartaNombre">El Mago</div>
                <div class="significado-carta" id="cartaSignificado">Manifiesta tu poder interior</div>
            </div>

            <button class="btn-tarot" id="btnLectura">♢ Tirar las cartas ♢</button>
            <div class="pie">
                <span>☆ el destino tiene bigotes ☆</span>
            </div>
        </div>
    </div>

    <script>

            // ——— Cada carta con su pose única ———

                { 
                    nombre: "El Mago", 
                    significado: "Manifiesta tu poder interior, creatividad y voluntad. Tienes todas las herramientas a tu disposición.",
                    svg: baseGato(`

                    svg: baseGato(`
                        <!-- Trompeta -->
                        <ellipse cx="90" cy="100" rx="8" ry="5" fill="#ffd700" transform="rotate(-30 90 100)"/>
                        <rect x="80" y="98" width="15" height="4" fill="#ffd700" transform="rotate(-30 85 100)"/>
                        <circle cx="82" cy="100" r="3" fill="#ffd700"/>
                    `)
                },
                { 
                    nombre: "El Mundo", 
                    significado: "Plenitud, logro y culminación. Has completado un ciclo, celebra tu viaje.",
                    svg: baseGato(`
                        <!-- Globo terráqueo -->
                        <circle cx="140" cy="155" r="15" fill="#4a90d9" stroke="#333" stroke-width="1.5"/>
                        <path d="M130 145 Q140 155 150 145" stroke="#2dcc70" stroke-width="2" fill="none"/>
                        <path d="M130 165 Q140 155 150 165" stroke="#2dcc70" stroke-width="2" fill="none"/>
                        <line x1="140" y1="140" x2="140" y2="170" stroke="#333" stroke-width="1"/>
                        <line x1="125" y1="155" x2="155" y2="155" stroke="#333" stroke-width="1"/>
                    `)
                },
                { 
                    nombre: "El Loco", 
                    significado: "Nuevos comienzos, espontaneidad y fe. Da el salto al vacío con confianza.",
                    svg: baseGato(`
                        <!-- Mochila -->
                        <rect x="115" y="190" width="20" height="25" rx="3" fill="#8b4513" stroke="#555" stroke-width="1.5"/>
                        <line x1="120" y1="190" x2="120" y2="180" stroke="#555" stroke-width="1.5"/>
                        <line x1="130" y1="190" x2="130" y2="180" stroke="#555" stroke-width="1.5"/>
                    `)
                }
            ];

            // ——— Elementos DOM ———
            const nombreEl = document.getElementById('cartaNombre');
            const significadoEl = document.getElementById('cartaSignificado');
            const gatoSVG = document.getElementById('gatoSVG');
            const btn = document.getElementById('btnLectura');
            const cartaTarot = document.getElementById('cartaTarot');

            // ——— Función para obtener carta aleatoria ———
            function obtenerCartaAleatoria() {
                const indice = Math.floor(Math.random() * cartas.length);
                return cartas[indice];
            }

            // ——— Función que actualiza la UI con efecto sutil ———
            function actualizarLectura() {
                // Efecto de brillo en la carta
                cartaTarot.classList.remove('brillando');
                void cartaTarot.offsetWidth; // Forzar reflow
                cartaTarot.classList.add('brillando');

                const carta = obtenerCartaAleatoria();

                setTimeout(() => {
                    nombreEl.textContent = carta.nombre;
                    significadoEl.textContent = carta.significado;
                    gatoSVG.innerHTML = carta.svg;
                }, 150);

                // Efecto en el botón
                btn.style.boxShadow = '0 0 60px #b77bdb, 0 8px 0 #2a1233';
                setTimeout(() => {
                    btn.style.boxShadow = '0 0 30px #8a4ab088, 0 6px 0 #2a1233';
                }, 400);

                // Quitar clase de brillo después de la animación
                setTimeout(() => {
                    cartaTarot.classList.remove('brillando');
                }, 2500);
            }

            // ——— Evento del botón ———
            btn.addEventListener('click', actualizarLectura);

            // ——— Cargar una carta aleatoria al inicio ———
            window.addEventListener('load', () => {
                const cartaInicial = obtenerCartaAleatoria();
                nombreEl.textContent = cartaInicial.nombre;
                significadoEl.textContent = cartaInicial.significado;
                gatoSVG.innerHTML = cartaInicial.svg;
            });

        })();
    </script>
</body>
</html>
