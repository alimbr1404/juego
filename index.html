<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐱 Cleo vidente ✨</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at center, #1a0b1f 0%, #0d0510 100%);
            font-family: 'Segoe UI', 'Georgia', serif;
            padding: 1.5rem;
        }

        .tarot-card {
            max-width: 900px;
            width: 100%;
            background: linear-gradient(145deg, #3b1f4a, #241530);
            padding: 2.8rem 2rem;
            border-radius: 4rem 2rem 4rem 2rem;
            box-shadow: 
                0 20px 60px rgba(106, 13, 173, 0.7),
                inset 0 0 40px rgba(180, 90, 220, 0.3),
                0 0 30px #9b4dca88;
            border: 1px solid #b380d0;
            backdrop-filter: blur(2px);
            transition: box-shadow 0.3s ease;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .tarot-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 40%, rgba(200, 120, 255, 0.08), transparent 60%),
                        radial-gradient(circle at 70% 80%, rgba(160, 70, 220, 0.08), transparent 50%);
            pointer-events: none;
            animation: girarBrillo 30s linear infinite;
            z-index: 0;
        }

        @keyframes girarBrillo {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tarot-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(2px 2px at 20% 30%, #d9b0ff, transparent),
                radial-gradient(2px 2px at 40% 70%, #c58af0, transparent),
                radial-gradient(2px 2px at 60% 20%, #e5c3ff, transparent),
                radial-gradient(3px 3px at 80% 80%, #b77bdb, transparent),
                radial-gradient(2px 2px at 10% 90%, #d4a0f5, transparent),
                radial-gradient(3px 3px at 90% 10%, #ca8bf0, transparent);
            background-size: 200% 200%;
            background-repeat: no-repeat;
            opacity: 0.5;
            pointer-events: none;
            animation: centelleo 8s ease-in-out infinite alternate;
            z-index: 0;
        }

        @keyframes centelleo {
            0% { opacity: 0.3; transform: scale(1); }
            100% { opacity: 0.8; transform: scale(1.05); }
        }

        .tarot-content {
            position: relative;
            z-index: 2;
        }

        h1 {
            font-size: 3rem;
            letter-spacing: 4px;
            color: #f0d6ff;
            text-shadow: 0 0 15px #b77bdb, 0 0 30px #8a4ab0, 0 0 60px #4f1f66;
            margin-bottom: 0.3rem;
            font-weight: 300;
            word-break: break-word;
        }

        .subtitulo {
            color: #c9a3dc;
            font-size: 0.9rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            border-top: 1px solid #7d4b9e;
            border-bottom: 1px solid #7d4b9e;
            display: inline-block;
            padding: 0.4rem 1.8rem;
            backdrop-filter: blur(4px);
            background: rgba(70, 30, 90, 0.3);
            border-radius: 40px;
            margin-bottom: 2.2rem;
            box-shadow: 0 0 20px #7d4b9e55;
        }

        .lectura-container {
            background: rgba(20, 8, 30, 0.7);
            backdrop-filter: blur(8px);
            border-radius: 3rem 1.5rem 3rem 1.5rem;
            padding: 1.8rem 1.2rem;
            margin: 1.8rem 0;
            border: 1px solid #a36bc0;
            box-shadow: inset 0 0 50px #552b6e55, 0 10px 30px #2e0f3b;
            transition: all 0.3s ease;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Contenedor de la carta (dibujo realista + detalles) */
        .carta-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 0.5rem;
        }

        /* Marco de la carta estilo tarjeta */
        .carta-marco {
            background: linear-gradient(145deg, #2d1638, #1a0b20);
            border-radius: 25px 10px 25px 10px;
            padding: 1.5rem 1.5rem 1.2rem;
            border: 2px solid #b380d0;
            box-shadow: 0 0 30px #7b3b9e55, inset 0 0 30px #3d1d4b;
            max-width: 380px;
            width: 100%;
            transition: all 0.3s ease;
            position: relative;
        }

        .carta-marco::before {
            content: '✦';
            position: absolute;
            top: 8px;
            left: 15px;
            color: #b380d0;
            font-size: 1.2rem;
            opacity: 0.5;
        }

        .carta-marco::after {
            content: '✦';
            position: absolute;
            bottom: 8px;
            right: 15px;
            color: #b380d0;
            font-size: 1.2rem;
            opacity: 0.5;
        }

        /* SVG del gato (dibujo realista/caricatura) */
        .gato-svg {
            width: 100%;
            max-width: 280px;
            height: auto;
            display: block;
            margin: 0 auto;
            filter: drop-shadow(0 0 15px rgba(180, 90, 220, 0.3));
        }

        .nombre-carta {
            font-size: 1.8rem;
            font-weight: 500;
            color: #f2e0ff;
            text-shadow: 0 0 12px #b380d0, 0 0 25px #7b3b9e;
            margin: 0.8rem 0 0.2rem;
            letter-spacing: 2px;
            line-height: 1.2;
        }

        .significado-carta {
            font-size: 1.05rem;
            color: #dcc0ec;
            max-width: 500px;
            margin: 0.3rem auto 0;
            padding: 0 0.5rem;
            line-height: 1.6;
            text-shadow: 0 0 8px #4b1d5e;
        }

        .simbolo-mistico {
            font-size: 2.8rem;
            margin: 0.2rem 0;
            opacity: 0.7;
            filter: drop-shadow(0 0 10px #b77bdb);
            letter-spacing: 8px;
        }

        .btn-tarot {
            background: linear-gradient(135deg, #6f3790, #451e5a);
            border: 1px solid #ac7ac9;
            color: #f3e6ff;
            font-size: 1.6rem;
            padding: 1.2rem 2.5rem;
            border-radius: 60px 20px 60px 20px;
            cursor: pointer;
            font-weight: 400;
            letter-spacing: 4px;
            box-shadow: 0 0 30px #8a4ab088, 0 8px 0 #2a1233;
            transition: all 0.15s ease;
            backdrop-filter: blur(4px);
            background: rgba(90, 40, 120, 0.8);
            margin-top: 0.8rem;
            width: 100%;
            max-width: 340px;
            text-transform: uppercase;
            font-family: 'Georgia', serif;
            position: relative;
            z-index: 3;
            border-bottom: 3px solid #c795e0;
        }

        .btn-tarot:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 0 50px #b77bdb, 0 10px 0 #2a1233;
            background: rgba(120, 60, 160, 0.9);
            border-color: #dbb0f0;
            color: #fff;
        }

        .btn-tarot:active {
            transform: translateY(6px);
            box-shadow: 0 0 30px #9b4dca, 0 2px 0 #2a1233;
        }

        .pie {
            margin-top: 2rem;
            color: #785a8a;
            font-size: 0.8rem;
            letter-spacing: 2px;
            border-top: 1px solid #4f2b62;
            padding-top: 1.5rem;
            opacity: 0.8;
            text-shadow: 0 0 6px #3d1d4b;
        }

        .pie span {
            display: inline-block;
            animation: parpadeo 3s infinite alternate;
        }

        @keyframes parpadeo {
            0% { opacity: 0.4; text-shadow: 0 0 2px #a06bbd; }
            100% { opacity: 1; text-shadow: 0 0 20px #c38ce0; }
        }

        @media (max-width: 500px) {
            .tarot-card {
                padding: 1.5rem 1rem;
                border-radius: 3rem 1.5rem 3rem 1.5rem;
            }
            h1 {
                font-size: 2.2rem;
            }
            .nombre-carta {
                font-size: 1.5rem;
            }
            .significado-carta {
                font-size: 0.95rem;
            }
            .btn-tarot {
                font-size: 1.2rem;
                padding: 1rem 1.5rem;
                max-width: 100%;
            }
            .subtitulo {
                font-size: 0.7rem;
                padding: 0.3rem 1rem;
            }
            .carta-marco {
                padding: 1rem;
            }
            .gato-svg {
                max-width: 200px;
            }
            .lectura-container {
                min-height: 300px;
                padding: 1.2rem 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="tarot-card">
        <div class="tarot-content">
            <h1>🐱 Cleo vidente</h1>
            <div class="subtitulo">✦ tarot gatuno ✦</div>

            <div class="lectura-container" id="lecturaContainer">
                <div class="simbolo-mistico">✦ ✦ ✦</div>
                <div class="carta-container">
                    <div class="carta-marco">
                        <!-- SVG del gato tuxedo con manchita café en la nariz -->
                        <svg class="gato-svg" id="gatoSVG" viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
                            <!-- Cuerpo (blanco) -->
                            <ellipse cx="140" cy="200" rx="75" ry="60" fill="#f5f0eb" stroke="#555" stroke-width="2"/>
                            <!-- Cabeza (blanco/negro) -->
                            <ellipse cx="140" cy="120" rx="70" ry="60" fill="#f5f0eb" stroke="#333" stroke-width="2"/>
                            <!-- Oreja izquierda (negra) -->
                            <path d="M80 85 L65 40 L105 70 Z" fill="#2d2d2d" stroke="#333" stroke-width="2"/>
                            <path d="M85 80 L72 48 L103 72 Z" fill="#ffd1b3" opacity="0.4"/>
                            <!-- Oreja derecha (negra) -->
                            <path d="M200 85 L215 40 L175 70 Z" fill="#2d2d2d" stroke="#333" stroke-width="2"/>
                            <path d="M195 80 L208 48 L177 72 Z" fill="#ffd1b3" opacity="0.4"/>
                            <!-- Parche negro ojo izquierdo -->
                            <ellipse cx="112" cy="115" rx="32" ry="28" fill="#2d2d2d"/>
                            <!-- Parche negro ojo derecho -->
                            <ellipse cx="168" cy="115" rx="32" ry="28" fill="#2d2d2d"/>
                            <!-- Ojos (brillantes) -->
                            <ellipse cx="112" cy="115" rx="16" ry="18" fill="#7ec850"/>
                            <ellipse cx="112" cy="115" rx="10" ry="12" fill="#2d1f0a"/>
                            <ellipse cx="108" cy="110" rx="4" ry="5" fill="white" opacity="0.8"/>
                            <ellipse cx="168" cy="115" rx="16" ry="18" fill="#7ec850"/>
                            <ellipse cx="168" cy="115" rx="10" ry="12" fill="#2d1f0a"/>
                            <ellipse cx="164" cy="110" rx="4" ry="5" fill="white" opacity="0.8"/>
                            <!-- Nariz (manchita café) -->
                            <ellipse cx="140" cy="130" rx="9" ry="6" fill="#8b6b4d"/>
                            <ellipse cx="140" cy="129" rx="7" ry="4" fill="#a88463"/>
                            <!-- Bigotes -->
                            <line x1="100" y1="130" x2="70" y2="125" stroke="#555" stroke-width="1.5" opacity="0.6"/>
                            <line x1="100" y1="135" x2="68" y2="138" stroke="#555" stroke-width="1.5" opacity="0.6"/>
                            <line x1="180" y1="130" x2="210" y2="125" stroke="#555" stroke-width="1.5" opacity="0.6"/>
                            <line x1="180" y1="135" x2="212" y2="138" stroke="#555" stroke-width="1.5" opacity="0.6"/>
                            <!-- Bigotes superiores -->
                            <line x1="105" y1="125" x2="75" y2="115" stroke="#555" stroke-width="1.5" opacity="0.6"/>
                            <line x1="175" y1="125" x2="205" y2="115" stroke="#555" stroke-width="1.5" opacity="0.6"/>
                            <!-- Boquita -->
                            <path d="M130 138 Q140 145 150 138" stroke="#6b4c3b" stroke-width="2" fill="none"/>
                            <!-- Patas delanteras (blanco con detalles negros) -->
                            <ellipse cx="110" cy="245" rx="20" ry="12" fill="#f5f0eb" stroke="#555" stroke-width="1.5"/>
                            <ellipse cx="170" cy="245" rx="20" ry="12" fill="#f5f0eb" stroke="#555" stroke-width="1.5"/>
                            <!-- Corbata o moño (tuxedo) -->
                            <path d="M115 180 L100 165 L130 170 L140 180 L150 170 L180 165 L165 180 Z" fill="#2d2d2d"/>
                            <ellipse cx="140" cy="180" rx="15" ry="10" fill="#3d3d3d"/>
                            <!-- Pecho blanco -->
                            <ellipse cx="140" cy="195" rx="25" ry="20" fill="#f5f0eb"/>
                        </svg>
                    </div>
                    <div class="nombre-carta" id="cartaNombre">El Mago</div>
                    <div class="significado-carta" id="cartaSignificado">Manifiesta tu poder interior, creatividad y voluntad.</div>
                </div>
                <div class="simbolo-mistico">✧ ✧ ✧</div>
            </div>

            <button class="btn-tarot" id="btnLectura">♢ Tirar las cartas ♢</button>
            <div class="pie">
                <span>☆ el destino tiene bigotes ☆</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            // ——— Mazo de cartas con gatitos tuxedo (manchita café en la nariz) ———
            const cartas = [
                { 
                    nombre: "El Mago", 
                    significado: "Manifiesta tu poder interior, creatividad y voluntad. Tienes todas las herramientas a tu disposición."
                },
                { 
                    nombre: "La Sacerdotisa", 
                    significado: "Intuición, misterio y sabiduría oculta. Confía en tu voz interior y en los sueños."
                },
                { 
                    nombre: "La Emperatriz", 
                    significado: "Abundancia, fertilidad y conexión con la naturaleza. El amor y la belleza te rodean."
                },
                { 
                    nombre: "El Emperador", 
                    significado: "Estructura, estabilidad y autoridad. Es momento de tomar el control con firmeza."
                },
                { 
                    nombre: "El Sumo Sacerdote", 
                    significado: "Tradición, guía espiritual y enseñanzas. Busca consejo en la sabiduría ancestral."
                },
                { 
                    nombre: "Los Enamorados", 
                    significado: "Decisiones importantes, uniones y dualidad. El amor te llama a elegir con el corazón."
                },
                { 
                    nombre: "El Carro", 
                    significado: "Victoria, determinación y control. Avanza con confianza hacia tus metas."
                },
                { 
                    nombre: "La Fuerza", 
                    significado: "Coraje, paciencia y dominio de los impulsos. La verdadera fuerza viene del interior."
                },
                { 
                    nombre: "El Ermitaño", 
                    significado: "Introspección, búsqueda de la verdad y soledad iluminadora. Una pausa para encontrar tu luz."
                },
                { 
                    nombre: "La Rueda de la Fortuna", 
                    significado: "Cambio, ciclos y destino. Lo que sube, baja; abre tu mente a las vueltas de la vida."
                },
                { 
                    nombre: "La Justicia", 
                    significado: "Equilibrio, karma y verdad. Actúa con integridad y recibirás lo justo."
                },
                { 
                    nombre: "El Colgado", 
                    significado: "Sacrificio, perspectiva y dejar ir. A veces, la rendición es la clave para avanzar."
                },
                { 
                    nombre: "La Muerte", 
                    significado: "Transformación, finales y nuevos comienzos. Deja atrás lo viejo para renacer."
                },
                { 
                    nombre: "La Templanza", 
                    significado: "Armonía, paciencia y equilibrio. Mezcla con sabiduría las fuerzas opuestas."
                },
                { 
                    nombre: "El Diablo", 
                    significado: "Apegos, ilusiones y liberación. Reconoce tus cadenas para romperlas."
                },
                { 
                    nombre: "La Torre", 
                    significado: "Cambio abrupto, revelación y caída de estructuras. A veces el caos trae claridad."
                },
                { 
                    nombre: "La Estrella", 
                    significado: "Esperanza, inspiración y sanación. Una luz brillante guía tu camino."
                },
                { 
                    nombre: "La Luna", 
                    significado: "Inconsciente, ilusiones y sueños. Navega entre sombras con intuición."
                },
                { 
                    nombre: "El Sol", 
                    significado: "Éxito, alegría y claridad. La luz dorada ilumina tu día."
                },
                { 
                    nombre: "El Juicio", 
                    significado: "Renacimiento, llamado interior y perdón. Escucha tu voz más profunda."
                },
                { 
                    nombre: "El Mundo", 
                    significado: "Plenitud, logro y culminación. Has completado un ciclo, celebra tu viaje."
                },
                { 
                    nombre: "El Loco", 
                    significado: "Nuevos comienzos, espontaneidad y fe. Da el salto al vacío con confianza."
                }
            ];

            // ——— Elementos DOM ———
            const nombreEl = document.getElementById('cartaNombre');
            const significadoEl = document.getElementById('cartaSignificado');
            const btn = document.getElementById('btnLectura');
            const container = document.getElementById('lecturaContainer');

            // ——— Función para obtener carta aleatoria ———
            function obtenerCartaAleatoria() {
                const indice = Math.floor(Math.random() * cartas.length);
                return cartas[indice];
            }

            // ——— Función que actualiza la UI con efecto sutil ———
            function actualizarLectura() {
                // Efecto de "destello" en el contenedor
                container.style.transition = 'box-shadow 0.2s ease, transform 0.2s ease';
                container.style.boxShadow = 'inset 0 0 70px #9b4dca, 0 0 40px #7b3b9e';
                container.style.transform = 'scale(0.97)';

                const carta = obtenerCartaAleatoria();

                setTimeout(() => {
                    nombreEl.textContent = carta.nombre;
                    significadoEl.textContent = carta.significado;

                    // Restauramos el estilo
                    container.style.boxShadow = 'inset 0 0 50px #552b6e55, 0 10px 30px #2e0f3b';
                    container.style.transform = 'scale(1)';
                }, 250);

                // Efecto en el botón
                btn.style.boxShadow = '0 0 60px #b77bdb, 0 8px 0 #2a1233';
                setTimeout(() => {
                    btn.style.boxShadow = '0 0 30px #8a4ab088, 0 8px 0 #2a1233';
                }, 350);
            }

            // ——— Evento del botón ———
            btn.addEventListener('click', actualizarLectura);

            // ——— Cargar una carta aleatoria al inicio ———
            window.addEventListener('load', () => {
                const cartaInicial = obtenerCartaAleatoria();
                nombreEl.textContent = cartaInicial.nombre;
                significadoEl.textContent = cartaInicial.significado;
                container.style.boxShadow = 'inset 0 0 50px #552b6e55, 0 10px 30px #2e0f3b';
                container.style.transform = 'scale(1)';
            });

        })();
    </script>
</body>
</html>
