<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐱 Cleo Vidente — Tarot Gatuno</title>
<style>
  :root{
    --gold: #e8c874;
    --gold-light: #f7e6b4;
    --gold-dark: #a67c2e;
    --ink: #241533;
    --accent: #b77bdb;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }

  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(130,70,170,0.25), transparent 55%),
      radial-gradient(ellipse at 85% 85%, rgba(90,40,130,0.3), transparent 55%),
      radial-gradient(circle at center, #1a0b23 0%, #0a0510 100%);
    font-family: 'Georgia', 'Segoe UI', serif;
    padding: 2.2rem 1rem;
    overflow-x:hidden;
    position:relative;
  }

  /* campo de estrellas de fondo */
  .estrellas{ position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.65; }
  .estrellas span{
    position:absolute; width:2px; height:2px; background:#e6cdfb; border-radius:50%;
    animation: parpadeoEstrella 3.5s ease-in-out infinite;
  }
  @keyframes parpadeoEstrella{ 0%,100%{opacity:.15} 50%{opacity:.9} }

  header{ position:relative; z-index:2; text-align:center; margin-bottom:1.6rem; }

  h1{
    font-size: clamp(1.9rem, 6vw, 2.7rem);
    letter-spacing:5px;
    font-weight:400;
    color:var(--gold-light);
    text-shadow: 0 0 12px rgba(232,200,116,.55), 0 0 34px rgba(155,77,202,.45);
  }
  h1 .patita{ display:inline-block; transform: translateY(2px); }

  .subtitulo{
    display:inline-block;
    margin-top:.6rem;
    color:#d8bce8;
    font-size:.72rem;
    letter-spacing:5px;
    text-transform:uppercase;
    padding:.45rem 1.6rem;
    border-top:1px solid #8a5aae;
    border-bottom:1px solid #8a5aae;
    background: rgba(70,30,90,.25);
    border-radius:40px;
  }

  /* ====== ESCENARIO DEL MAZO ====== */
  .escenario{
    position:relative;
    z-index:2;
    width: 300px;
    max-width: 84vw;
    aspect-ratio: 300 / 512;
    perspective: 1600px;
  }

  .carta-fantasma{
    position:absolute;
    inset:0;
    border-radius: 18px;
    background: linear-gradient(160deg,#3a1e4d,#1c0e28);
    border: 1px solid #6f4489;
    box-shadow: 0 10px 30px rgba(0,0,0,.55);
  }
  .carta-fantasma.f1{ transform: rotate(-7deg) translate(-10px, 6px); z-index:1; opacity:.85;}
  .carta-fantasma.f2{ transform: rotate(6deg) translate(9px, 9px); z-index:0; opacity:.7;}

  .card-flip-container{
    position:relative;
    z-index:2;
    width:100%; height:100%;
    transform-style:preserve-3d;
    transition: transform .9s cubic-bezier(.4,.1,.2,1);
  }
  .card-flip-container.girando{ transform: rotateY(360deg) scale(1.015); }

  .tarot-card{
    position:relative;
    width:100%; height:100%;
    border-radius: 18px;
    background:
      radial-gradient(120% 90% at 50% 0%, rgba(255,255,255,.05), transparent 60%),
      linear-gradient(160deg,#4a2760,#2a1638 55%, #1c0e28);
    border: 2px solid var(--gold);
    box-shadow:
      0 16px 46px rgba(0,0,0,.55),
      0 0 0 1px rgba(255,255,255,.04) inset,
      0 0 26px rgba(183,123,219,.35);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition: box-shadow .6s ease;
  }

  /* marco interior fino, doble línea como carta real */
  .tarot-card::before{
    content:'';
    position:absolute; inset:8px;
    border:1px solid rgba(232,200,116,.55);
    border-radius:12px;
    pointer-events:none;
    z-index:3;
  }

  /* brillo diagonal permanente (foil sutil) */
  .tarot-card .foil{
    position:absolute; inset:0; z-index:4; pointer-events:none; mix-blend-mode:screen;
    background: linear-gradient(115deg, transparent 40%, rgba(255,255,255,.18) 48%, rgba(255,255,255,.04) 52%, transparent 60%);
    background-size: 260% 260%;
    background-position: 0% 0%;
    animation: foilLento 7s ease-in-out infinite;
    opacity:.55;
  }
  @keyframes foilLento{
    0%{ background-position: 120% -20%; }
    50%{ background-position: -20% 120%; }
    100%{ background-position: 120% -20%; }
  }

  /* estallido de brillo al tirar */
  .tarot-card.brillo-burst{
    animation: burst .9s ease;
    box-shadow:
      0 16px 46px rgba(0,0,0,.55),
      0 0 60px var(--accent),
      0 0 130px color-mix(in srgb, var(--accent) 70%, transparent),
      0 0 0 1px rgba(255,255,255,.06) inset;
  }
  @keyframes burst{
    0%{ filter:brightness(1); }
    30%{ filter:brightness(1.35); }
    100%{ filter:brightness(1); }
  }
  .tarot-card .sweep{
    position:absolute; top:-30%; left:-60%; width:60%; height:160%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
    transform: skewX(-18deg);
    z-index:5; pointer-events:none; opacity:0;
  }
  .tarot-card.brillo-burst .sweep{ animation: barrido .9s ease; }
  @keyframes barrido{
    0%{ left:-60%; opacity:0; }
    15%{ opacity:.9; }
    55%{ opacity:.5; }
    100%{ left:130%; opacity:0; }
  }

  .chispas{ position:absolute; inset:0; z-index:6; pointer-events:none; overflow:visible; }
  .chispa{
    position:absolute; width:6px; height:6px; border-radius:50%;
    background: radial-gradient(circle, #fff, var(--accent) 60%, transparent 70%);
    animation: subirChispa 1s ease-out forwards;
  }
  @keyframes subirChispa{
    0%{ transform: translateY(0) scale(0.4); opacity:0; }
    15%{ opacity:1; }
    100%{ transform: translateY(-70px) scale(1.1); opacity:0; }
  }

  /* ---- contenido de la carta ---- */
  .tarot-content{
    position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center;
    height:100%;
    padding: .85rem .7rem .7rem;
  }

  .indice{
    position:absolute; z-index:7;
    font-family:'Georgia',serif; color: var(--gold-light);
    font-size:.72rem; letter-spacing:1px; text-align:center; line-height:1.1;
    text-shadow:0 0 6px rgba(232,200,116,.5);
  }
  .indice .glifo{ font-size:.85rem; display:block; }
  .indice.tl{ top:9px; left:11px; }
  .indice.br{ bottom:9px; right:11px; transform: rotate(180deg); }

  .banner-nombre{
    margin-top: .15rem;
    font-size: clamp(1rem, 4.6vw, 1.28rem);
    letter-spacing:1.5px;
    font-weight:600;
    text-align:center;
    background: linear-gradient(180deg, var(--gold-light), var(--gold) 55%, var(--gold-dark));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter: drop-shadow(0 1px 1px rgba(0,0,0,.5));
    padding: 0 1.6rem;
  }

  .romanos{
    font-size:.62rem; letter-spacing:4px; color:#c9a3dc; text-transform:uppercase;
    margin-top:.15rem; opacity:.85;
  }

  .ilustracion{
    flex: 1 1 auto;
    width:100%;
    margin: .4rem 0 .2rem;
    border-radius: 10px;
    background:
      radial-gradient(circle at 50% 38%, rgba(183,123,219,.22), transparent 62%),
      linear-gradient(180deg, rgba(0,0,0,.18), rgba(0,0,0,.32));
    border: 1px solid rgba(232,200,116,.35);
    box-shadow: inset 0 0 26px rgba(0,0,0,.4);
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    position:relative;
  }
  .ilustracion::before{
    content:'';
    position:absolute; inset:0;
    background-image:
      radial-gradient(1.5px 1.5px at 15% 20%, #e9d3ff, transparent),
      radial-gradient(1.5px 1.5px at 80% 15%, #e9d3ff, transparent),
      radial-gradient(1.5px 1.5px at 30% 85%, #cf9ef2, transparent),
      radial-gradient(1.5px 1.5px at 70% 80%, #cf9ef2, transparent),
      radial-gradient(1.5px 1.5px at 90% 55%, #e9d3ff, transparent);
    opacity:.7;
  }

  .gato-svg{ width:78%; height:78%; filter: drop-shadow(0 6px 10px rgba(0,0,0,.4)); position:relative; z-index:1; }

  .significado{
    font-size:.72rem;
    color:#e6d7f0;
    text-align:center;
    line-height:1.35;
    font-style:italic;
    padding: 0 .3rem;
    min-height: 2.6em;
  }

  .keywords{
    display:flex; gap:.35rem; justify-content:center; flex-wrap:wrap;
    margin: .35rem 0 .1rem;
  }
  .keywords span{
    font-size:.58rem; letter-spacing:1px; text-transform:uppercase;
    color: var(--ink);
    background: linear-gradient(180deg, var(--gold-light), var(--gold));
    padding:.18rem .55rem;
    border-radius: 20px;
    font-family:'Segoe UI',sans-serif;
    box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }

  /* ====== controles ====== */
  .controles{ position:relative; z-index:2; text-align:center; margin-top:1.8rem; width:100%; max-width:320px; }

  .btn-tarot{
    background: linear-gradient(160deg,#7b46a0,#4a2260);
    border: 1px solid #c795e0;
    border-bottom: 3px solid #7d4b9e;
    color:#f7ecff;
    font-family:'Georgia',serif;
    font-size:1.05rem;
    letter-spacing:2.5px;
    text-transform:uppercase;
    padding: .85rem 1.6rem;
    border-radius: 50px 14px 50px 14px;
    cursor:pointer;
    width:100%;
    box-shadow: 0 0 26px rgba(138,74,176,.55), 0 6px 0 #2a1233;
    transition: transform .15s ease, box-shadow .25s ease;
  }
  .btn-tarot:hover{ transform: translateY(-3px) scale(1.015); box-shadow: 0 0 44px rgba(183,123,219,.75), 0 8px 0 #2a1233; }
  .btn-tarot:active{ transform: translateY(4px); box-shadow: 0 0 22px rgba(155,77,202,.6), 0 2px 0 #2a1233; }

  .pie{
    margin-top:1.5rem; text-align:center;
    color:#8a6a9c; font-size:.72rem; letter-spacing:2px;
  }
  .pie span{ display:inline-block; animation: parpadeo 3s infinite alternate; }
  @keyframes parpadeo{ 0%{opacity:.4} 100%{opacity:1; text-shadow:0 0 14px #c38ce0;} }

  @media (max-width:420px){
    .escenario{ width: 260px; }
    .btn-tarot{ font-size:.92rem; letter-spacing:1.6px; }
  }
</style>
</head>
<body>

<div class="estrellas" id="estrellas"></div>

<header>
  <h1><span class="patita">🐾</span> Cleo Vidente <span class="patita">🐾</span></h1>
  <div class="subtitulo">✦ Tarot Gatuno ✦</div>
</header>

<div class="escenario">
  <div class="carta-fantasma f2"></div>
  <div class="carta-fantasma f1"></div>

  <div class="card-flip-container" id="flipContainer">
    <div class="tarot-card" id="cartaTarot">
      <div class="foil"></div>
      <div class="sweep"></div>
      <div class="chispas" id="chispas"></div>

      <span class="indice tl"><span class="glifo" id="glifoTL">✦</span><span id="numTL"></span></span>
      <span class="indice br"><span class="glifo" id="glifoBR">✦</span><span id="numBR"></span></span>

      <div class="tarot-content">
        <div class="banner-nombre" id="cartaNombre">El Mago</div>
        <div class="romanos" id="cartaNumero">Arcano I</div>

        <div class="ilustracion">
          <svg class="gato-svg" id="gatoSVG" viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg"></svg>
        </div>

        <div class="keywords" id="cartaKeywords"></div>
        <div class="significado" id="cartaSignificado">Manifiesta tu poder interior</div>
      </div>
    </div>
  </div>
</div>

<div class="controles">
  <button class="btn-tarot" id="btnLectura">♢ Tirar las Cartas ♢</button>
  <div class="pie"><span>☆ el destino tiene bigotes ☆</span></div>
</div>

<script>
(function(){

/* ======================= estrellas de fondo ======================= */
const campo = document.getElementById('estrellas');
for(let i=0;i<60;i++){
  const s = document.createElement('span');
  s.style.left = Math.random()*100+'%';
  s.style.top = Math.random()*100+'%';
  s.style.animationDelay = (Math.random()*3.5)+'s';
  s.style.width = s.style.height = (Math.random()<0.15 ? '3px':'2px');
  campo.appendChild(s);
}

/* ======================= paletas de pelaje (gatos de todo tipo) ======================= */
const P = {
  tuxedo:     { ear:'#2d2d2d', earIn:'#ffd1b3', mask:'#2d2d2d', head:'#f5f0eb', body:'#f5f0eb', belly:'#ffffff', leg:'#f5f0eb', tail:'#2d2d2d', tailTip:'#f5f0eb', nose:'#8b6b4d', eye:'#7ec850', accent:'#8a6fd8' },
  naranja:    { ear:'#d97a3d', earIn:'#ffd9c2', mask:null, head:'#f2a765', body:'#f2a765', belly:'#fbe0c0', leg:'#f2a765', tail:'#d97a3d', tailTip:'#fbe0c0', nose:'#c96b3f', eye:'#3f8f4f', stripe:'#b85f2a', accent:'#e8935a' },
  plateado:   { ear:'#7d7d8a', earIn:'#c9a3dc', mask:null, head:'#a3a3b0', body:'#a3a3b0', belly:'#d8d8e0', leg:'#a3a3b0', tail:'#7d7d8a', tailTip:'#d8d8e0', nose:'#6b5b73', eye:'#c9a3dc', accent:'#9d8ec9' },
  calico:     { ear:'#2d2d2d', earIn:'#ffd1b3', mask:null, head:'#f5f0eb', body:'#f5f0eb', belly:'#ffffff', leg:'#f5f0eb', tail:'#e08a3c', tailTip:'#f5f0eb', nose:'#e8a0a0', eye:'#4a8fc9', patch1:'#e08a3c', patch2:'#2d2d2d', accent:'#d9a066' },
  negro:      { ear:'#26232b', earIn:'#5b3d55', mask:null, head:'#2b2b33', body:'#2b2b33', belly:'#3a3a44', leg:'#2b2b33', tail:'#26232b', tailTip:'#2b2b33', nose:'#55404a', eye:'#ffd700', accent:'#6a5acd' },
  blanco:     { ear:'#fbf8f2', earIn:'#ffd1b3', mask:null, head:'#fbf8f2', body:'#fbf8f2', belly:'#ffffff', leg:'#fbf8f2', tail:'#fbf8f2', tailTip:'#f0e8da', nose:'#e8a0a0', eye:'#7ec8e3', eye2:'#d9a843', accent:'#cbb8e0' },
  cafeTabby:  { ear:'#6b4a35', earIn:'#e0b088', mask:null, head:'#8a6247', body:'#8a6247', belly:'#c9a480', leg:'#8a6247', tail:'#6b4a35', tailTip:'#c9a480', nose:'#4a3324', eye:'#d4a843', stripe:'#55392a', accent:'#a9825f' },
  siames:     { ear:'#4a3324', earIn:'#8a6a52', mask:'#4a3324', head:'#f0e2c8', body:'#f0e2c8', belly:'#f7ecd8', leg:'#f0e2c8', tail:'#4a3324', tailTip:'#4a3324', nose:'#a86b5a', eye:'#5aa8e8', points:'#4a3324', accent:'#c9b088' },
  azulRuso:   { ear:'#7c8a99', earIn:'#b9c4cd', mask:null, head:'#8896a3', body:'#8896a3', belly:'#b9c4cd', leg:'#8896a3', tail:'#7c8a99', tailTip:'#b9c4cd', nose:'#6b5b6a', eye:'#6bc46b', accent:'#8ea0c9' },
  crema:      { ear:'#d9b98a', earIn:'#ffe6c2', mask:null, head:'#f0d9b5', body:'#f0d9b5', belly:'#fbeed7', leg:'#f0d9b5', tail:'#d9b98a', tailTip:'#fbeed7', nose:'#c98a6b', eye:'#d99a3d', accent:'#e0b878' },
};

/* ======================= piezas reutilizables ======================= */
function orejas(pal, alerta){
  const rot = alerta ? '' : '';
  return `
    <path d="M80 85 L65 40 L105 70 Z" fill="${pal.ear}" stroke="#1a1a1a33" stroke-width="1.5"/>
    <path d="M85 80 L72 48 L103 72 Z" fill="${pal.earIn}" opacity="0.55"/>
    <path d="M200 85 L215 40 L175 70 Z" fill="${pal.ear}" stroke="#1a1a1a33" stroke-width="1.5"/>
    <path d="M195 80 L208 48 L177 72 Z" fill="${pal.earIn}" opacity="0.55"/>
  `;
}

function cabeza(pal){
  let mask = '';
  if(pal.mask){
    mask = `
      <ellipse cx="112" cy="115" rx="32" ry="28" fill="${pal.mask}"/>
      <ellipse cx="168" cy="115" rx="32" ry="28" fill="${pal.mask}"/>
    `;
  }
  let puntosSiames = '';
  if(pal.points){
    puntosSiames = `
      <ellipse cx="140" cy="132" rx="26" ry="20" fill="${pal.points}" opacity="0.85"/>
    `;
  }
  return `
    <ellipse cx="140" cy="120" rx="70" ry="60" fill="${pal.head}" stroke="#00000030" stroke-width="2"/>
    ${mask}${puntosSiames}
  `;
}

function ojos(pal, estado){
  const c1=112,c2=168,cy=115;
  const iris = pal.eye;
  const iris2 = pal.eye2 || pal.eye;
  if(estado==='cerrado'){
    return `
      <path d="M100 115 Q112 106 124 115" stroke="#2d1f0a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      <path d="M156 115 Q168 106 180 115" stroke="#2d1f0a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    `;
  }
  if(estado==='feliz'){
    return `
      <path d="M100 118 Q112 104 124 118" stroke="#2d1f0a" stroke-width="2.6" fill="none" stroke-linecap="round"/>
      <path d="M156 118 Q168 104 180 118" stroke="#2d1f0a" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    `;
  }
  if(estado==='enojado'){
    return `
      <ellipse cx="${c1}" cy="${cy}" rx="15" ry="16" fill="#ff3b3b"/>
      <ellipse cx="${c1}" cy="${cy}" rx="6" ry="12" fill="#1a0000"/>
      <ellipse cx="${c2}" cy="${cy}" rx="15" ry="16" fill="#ff3b3b"/>
      <ellipse cx="${c2}" cy="${cy}" rx="6" ry="12" fill="#1a0000"/>
      <path d="M96 98 L124 106" stroke="#2d1f0a" stroke-width="3" stroke-linecap="round"/>
      <path d="M184 98 L156 106" stroke="#2d1f0a" stroke-width="3" stroke-linecap="round"/>
    `;
  }
  // abierto normal / grande y tierno
  return `
    <ellipse cx="${c1}" cy="${cy}" rx="16" ry="18" fill="${iris}"/>
    <ellipse cx="${c1}" cy="${cy}" rx="9.5" ry="12" fill="#1e1a12"/>
    <ellipse cx="108" cy="109" rx="4.2" ry="5.4" fill="white" opacity="0.9"/>
    <ellipse cx="115" cy="120" rx="1.8" ry="2.2" fill="white" opacity="0.6"/>
    <ellipse cx="${c2}" cy="${cy}" rx="16" ry="18" fill="${iris2}"/>
    <ellipse cx="${c2}" cy="${cy}" rx="9.5" ry="12" fill="#1e1a12"/>
    <ellipse cx="164" cy="109" rx="4.2" ry="5.4" fill="white" opacity="0.9"/>
    <ellipse cx="171" cy="120" rx="1.8" ry="2.2" fill="white" opacity="0.6"/>
  `;
}

function rubor(){
  return `
    <ellipse cx="90" cy="132" rx="10" ry="6" fill="#ff9eb0" opacity="0.35"/>
    <ellipse cx="190" cy="132" rx="10" ry="6" fill="#ff9eb0" opacity="0.35"/>
  `;
}

function narizBoca(pal, estado){
  let boca = `<path d="M130 138 Q140 145 150 138" stroke="#6b4c3b" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  if(estado==='feliz') boca = `<path d="M122 137 Q140 155 158 137" stroke="#6b4c3b" stroke-width="2.2" fill="none" stroke-linecap="round"/>`;
  if(estado==='pequena') boca = `<path d="M134 139 Q140 142 146 139" stroke="#6b4c3b" stroke-width="2" fill="none" stroke-linecap="round"/>`;
  if(estado==='seria') boca = `<line x1="132" y1="140" x2="148" y2="140" stroke="#6b4c3b" stroke-width="2" stroke-linecap="round"/>`;
  return `
    <ellipse cx="140" cy="130" rx="9" ry="6" fill="${pal.nose}"/>
    <ellipse cx="140" cy="129" rx="7" ry="4" fill="${pal.nose}" opacity="0.65"/>
    ${boca}
  `;
}

function bigotes(){
  return `
    <line x1="100" y1="130" x2="70" y2="125" stroke="#5559" stroke-width="1.5" opacity="0.55"/>
    <line x1="100" y1="135" x2="68" y2="138" stroke="#5559" stroke-width="1.5" opacity="0.55"/>
    <line x1="180" y1="130" x2="210" y2="125" stroke="#5559" stroke-width="1.5" opacity="0.55"/>
    <line x1="180" y1="135" x2="212" y2="138" stroke="#5559" stroke-width="1.5" opacity="0.55"/>
    <line x1="105" y1="125" x2="75" y2="115" stroke="#5559" stroke-width="1.5" opacity="0.55"/>
    <line x1="175" y1="125" x2="205" y2="115" stroke="#5559" stroke-width="1.5" opacity="0.55"/>
  `;
}

function pecho(pal){
  if(pal.mask || pal.points || pal.patch1){
    return `<ellipse cx="140" cy="195" rx="25" ry="20" fill="${pal.belly}"/>`;
  }
  return `<ellipse cx="140" cy="197" rx="22" ry="17" fill="${pal.belly}" opacity="0.7"/>`;
}

function estampado(pal){
  let out = '';
  if(pal.stripe){
    out += `
      <path d="M118 78 Q122 92 118 104" stroke="${pal.stripe}" stroke-width="3" fill="none" opacity="0.55" stroke-linecap="round"/>
      <path d="M162 78 Q158 92 162 104" stroke="${pal.stripe}" stroke-width="3" fill="none" opacity="0.55" stroke-linecap="round"/>
      <path d="M105 165 Q140 172 175 165" stroke="${pal.stripe}" stroke-width="4" fill="none" opacity="0.4" stroke-linecap="round"/>
      <path d="M110 185 Q140 191 170 185" stroke="${pal.stripe}" stroke-width="4" fill="none" opacity="0.35" stroke-linecap="round"/>
    `;
  }
  if(pal.patch1){
    out += `
      <path d="M95 90 Q75 75 90 55 Q112 62 108 90 Z" fill="${pal.patch1}" opacity="0.92"/>
      <path d="M170 170 Q205 165 200 200 Q175 210 165 195 Z" fill="${pal.patch2}" opacity="0.92"/>
      <ellipse cx="118" cy="215" rx="18" ry="14" fill="${pal.patch1}" opacity="0.85"/>
    `;
  }
  return out;
}

/* ======================= poses (patas / cola / cuerpo) ======================= */
function patasTraseras(pal, cx1,cx2,cy,rx=20,ry=12,rot1=0,rot2=0){
  return `
    <ellipse cx="${cx1}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${pal.leg}" stroke="#00000025" stroke-width="1.5" transform="rotate(${rot1} ${cx1} ${cy})"/>
    <ellipse cx="${cx2}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${pal.leg}" stroke="#00000025" stroke-width="1.5" transform="rotate(${rot2} ${cx2} ${cy})"/>
  `;
}

function cuerpo(pal, cx=140, cy=200, rx=75, ry=60){
  return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${pal.body}" stroke="#00000030" stroke-width="2"/>`;
}

function moño(){
  return `
    <path d="M115 180 L100 165 L130 170 L140 180 L150 170 L180 165 L165 180 Z" fill="#2d2d2d"/>
    <ellipse cx="140" cy="180" rx="15" ry="10" fill="#3d3d3d"/>
  `;
}

/* ======================= constructor final de cada gato ======================= */
function dibujarGato(coat, poseFn, extra, mirror){
  const pal = P[coat];
  const p = poseFn(pal);
  const grupo = `
    ${p.cuerpo}
    ${p.patas}
    ${p.cola}
    ${cabeza(pal)}
    ${orejas(pal)}
    ${ojos(pal, p.ojos||'abierto')}
    ${p.rubor ? rubor() : ''}
    ${narizBoca(pal, p.boca||'')}
    ${bigotes()}
    ${p.pecho!==false ? pecho(pal) : ''}
    ${p.accesorio||''}
    ${p.corbata ? moño() : ''}
    ${estampado(pal)}
    ${extra||''}
  `;
  if(mirror){
    return `<g transform="translate(280,0) scale(-1,1)">${grupo}</g>`;
  }
  return grupo;
}

/* ======================= DOM ======================= */
const nombreEl = document.getElementById('cartaNombre');
const numeroEl = document.getElementById('cartaNumero');
const significadoEl = document.getElementById('cartaSignificado');
const keywordsEl = document.getElementById('cartaKeywords');
const gatoSVG = document.getElementById('gatoSVG');
const numTL = document.getElementById('numTL');
const numBR = document.getElementById('numBR');
const btn = document.getElementById('btnLectura');
const cartaTarot = document.getElementById('cartaTarot');
const flipContainer = document.getElementById('flipContainer');
const chispasCont = document.getElementById('chispas');

function obtenerCartaAleatoria(){
  return cartas[Math.floor(Math.random()*cartas.length)];
}

function pintarCarta(carta){
  nombreEl.textContent = carta.nombre;
  numeroEl.textContent = carta.romano;
  significadoEl.textContent = carta.significado;
  numTL.textContent = carta.num;
  numBR.textContent = carta.num;
  keywordsEl.innerHTML = carta.kws.map(k=>`<span>${k}</span>`).join('');
  gatoSVG.innerHTML = dibujarGato(carta.coat, carta.pose, carta.extra, carta.mirror);
  cartaTarot.style.setProperty('--accent', P[carta.coat].accent);
}

function lanzarChispas(){
  chispasCont.innerHTML = '';
  const n = 14;
  for(let i=0;i<n;i++){
    const c = document.createElement('div');
    c.className = 'chispa';
    c.style.left = (10+Math.random()*80)+'%';
    c.style.top = (15+Math.random()*70)+'%';
    c.style.animationDelay = (Math.random()*0.35)+'s';
    chispasCont.appendChild(c);
  }
  setTimeout(()=>{ chispasCont.innerHTML=''; }, 1400);
}

function actualizarLectura(){
  const carta = obtenerCartaAleatoria();

  flipContainer.classList.add('girando');
  cartaTarot.classList.remove('brillo-burst');
  void cartaTarot.offsetWidth;
  cartaTarot.classList.add('brillo-burst');
  lanzarChispas();

  setTimeout(()=>{ pintarCarta(carta); }, 430);

  btn.style.boxShadow = '0 0 55px rgba(183,123,219,.85), 0 8px 0 #2a1233';
  setTimeout(()=>{ btn.style.boxShadow = ''; }, 500);

  setTimeout(()=>{ flipContainer.classList.remove('girando'); }, 950);
  setTimeout(()=>{ cartaTarot.classList.remove('brillo-burst'); }, 1300);
}

btn.addEventListener('click', actualizarLectura);

window.addEventListener('load', ()=>{
  pintarCarta(obtenerCartaAleatoria());
});

})();
